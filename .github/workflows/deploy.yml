name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages looks the uploaded artifact up through the Actions API.
  # Without this the API answers with an empty list rather than a 403, and
  # the step fails as "No artifacts named github-pages were found" while the
  # run summary plainly shows that artifact — which is what happened here.
  actions: read

# Never let two deployments race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Stage the publishable files
        # site/ holds two things the web root must not expose: deploy/nginx.conf
        # (server config, documentation only) and .htaccess (Apache-only, inert
        # on Pages). Everything else ships as-is.
        #
        # site/CNAME ships too, but note it does NOT configure the custom
        # domain: when the Pages source is "GitHub Actions", GitHub ignores a
        # CNAME file in the artifact and reads the domain from the repository's
        # Pages settings instead. Verified empirically — the first successful
        # deploy carried CNAME and left Settings > Pages > Custom domain empty.
        # The file is kept only so a branch-based or self-hosted deploy would
        # still find it. Change the domain in Settings, not here.
        run: |
          mkdir -p _pages
          cp -R site/. _pages/
          rm -rf _pages/deploy _pages/.htaccess
          echo "Publishing:"
          find _pages -type f | sort

      - name: Stamp the asset URLs with this commit
        # GitHub Pages serves CSS and JS with a ten-minute cache and the
        # filenames never change, so a returning visitor can land on new HTML
        # while the browser still holds the previous stylesheet — which renders
        # as a broken page, not a stale one. Rewriting ?v=DEPLOY_ID to the
        # commit sha makes every deploy a fresh URL. Fonts are left alone:
        # their names already change with their contents.
        run: |
          STAMP="${GITHUB_SHA::12}"
          grep -rl 'DEPLOY_ID' _pages --include='*.html' | while read -r f; do
            sed -i "s/DEPLOY_ID/$STAMP/g" "$f"
          done
          echo "asset version: $STAMP"
          grep -rho 'assets/[a-z]*/[a-z.]*?v=[0-9a-f]*' _pages --include='*.html' | sort -u

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      - name: Wait for the artifact to settle
        # deploy-pages fails intermittently here with "No artifacts named
        # github-pages were found" while the run summary lists it. Polling the
        # REST API was not enough: that poll passes and the very next step
        # still cannot see the artifact, so deploy-pages reads it through a
        # different service that lags behind. Wait for REST, then give that
        # other service a fixed moment to catch up.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          for i in $(seq 1 30); do
            if gh api "$api" --jq '.artifacts[].name' | grep -qx 'github-pages'; then
              echo "artifact listed after ${i} attempt(s)"
              sleep 20
              exit 0
            fi
            sleep 4
          done
          echo "::error::github-pages artifact never appeared in the Actions API"
          gh api "$api" --jq '.artifacts[] | {name, size_in_bytes, expired}'
          exit 1

      - name: Deploy
        id: deployment
        # First attempt is allowed to fail: the lookup above is best effort,
        # and a re-run by hand has always succeeded. Retrying in place saves
        # the round trip.
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy — second attempt
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
