# Next Ukraine Foundation — nginx server block.
# Copy into /etc/nginx/sites-available/nextukraine, symlink into sites-enabled,
# then: nginx -t && systemctl reload nginx
#
# This file is documentation, not part of the site — do not upload the deploy/
# directory to the web root.

server {
    listen 80;
    listen [::]:80;
    server_name nextukraine.org www.nextukraine.org;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://nextukraine.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nextukraine.org;

    ssl_certificate     /etc/letsencrypt/live/nextukraine.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextukraine.org/privkey.pem;

    return 301 https://nextukraine.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nextukraine.org;

    root /var/www/nextukraine;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nextukraine.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextukraine.org/privkey.pem;

    charset utf-8;
    error_page 404 /404.html;

    # /model -> /model/ so relative asset paths keep resolving
    location / {
        try_files $uri $uri/ =404;
    }

    # --- compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/manifest+json;

    # --- caching ------------------------------------------------------------
    # Cache-Control comes from `expires`, not `add_header`, on purpose: an
    # add_header inside a location block DISCARDS every header inherited from
    # the server block, which would silently drop the CSP below on exactly the
    # responses that need it.
    location ~* \.(css|js|woff2|jpg|jpeg|png|svg)$ {
        expires 1y;
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
    }

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The site loads nothing from third parties — widen only if you add an
    # embed or an analytics script.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    location = /.htaccess { deny all; }
}
